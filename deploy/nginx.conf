server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Reduz o tempo de transferência do bundle principal e dos chunks em
  # conexões móveis sem alterar os arquivos versionados do build.
  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # O HTML aponta para os assets versionados do build atual. Ele não pode
  # ficar preso no cache após uma publicação, senão o navegador pode tentar
  # carregar chunks que já não existem.
  location = /index.html {
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    try_files $uri =404;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
