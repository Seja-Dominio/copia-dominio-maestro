name: Security checks

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database-migration-replay:
    name: Clean-room database migration replay
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_TEST_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      SUPABASE_TEST_PROJECT_REF: maestro-local-verify
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install verifier dependencies
        run: npm ci --ignore-scripts
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.115.0
      - name: Start only the local database
        run: supabase start --exclude gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Replay every migration from a clean database
        run: supabase db reset --local --no-seed
      - name: Verify source-scoped legacy projection reconciliation
        shell: bash
        run: |
          mapfile -t db_containers < <(docker ps --filter label=com.supabase.cli.project --filter name=supabase_db --format '{{.Names}}')
          if [ "${#db_containers[@]}" -ne 1 ]; then
            echo "Expected exactly one Supabase database container; refusing to run projection reconciliation fixtures."
            exit 1
          fi
          {
            sed '/^-- LEGACY_PROJECTION_RECONCILE_MIGRATION_BARRIER$/,$d' scripts/sql/legacy-projection-reconcile-ci.test.sql
            cat supabase/migrations/20261002170000_reconcile_source_scoped_legacy_projections.sql
            sed -n '/^-- LEGACY_PROJECTION_RECONCILE_MIGRATION_BARRIER$/,$p' scripts/sql/legacy-projection-reconcile-ci.test.sql | sed '1d' | sed '/^-- LEGACY_PROJECTION_RECONCILE_IDEMPOTENCE_BARRIER$/,$d'
            cat supabase/migrations/20261002170000_reconcile_source_scoped_legacy_projections.sql
            sed -n '/^-- LEGACY_PROJECTION_RECONCILE_IDEMPOTENCE_BARRIER$/,$p' scripts/sql/legacy-projection-reconcile-ci.test.sql | sed '1d'
          } | docker exec -i "${db_containers[0]}" psql -U postgres -d postgres -v ON_ERROR_STOP=1
      - name: Verify source-scope conflicts abort before reconciliation writes
        shell: bash
        run: |
          mapfile -t db_containers < <(docker ps --filter label=com.supabase.cli.project --filter name=supabase_db --format '{{.Names}}')
          if [ "${#db_containers[@]}" -ne 1 ]; then
            echo "Expected exactly one Supabase database container; refusing to run projection conflict fixture."
            exit 1
          fi
          set +e
          migration_output=$(
            {
              sed '/^-- LEGACY_PROJECTION_RECONCILE_CONFLICT_MIGRATION_BARRIER$/,$d' scripts/sql/legacy-projection-reconcile-conflict-ci.test.sql
              cat supabase/migrations/20261002170000_reconcile_source_scoped_legacy_projections.sql
            } | docker exec -i "${db_containers[0]}" psql -U postgres -d postgres -v ON_ERROR_STOP=1 2>&1
          )
          migration_status=$?
          set -e
          if [ "$migration_status" -eq 0 ] || ! grep -Fq "existing tenant mapping conflicts with source scope" <<< "$migration_output"; then
            echo "Expected reconciliation to reject a mapping that conflicts with legacy_records.organization_id."
            exit 1
          fi
          if [ "$(docker exec "${db_containers[0]}" psql -U postgres -d postgres -Atqc "select not exists (select 1 from public.legacy_records where record_id = 'projection-reconcile-conflict') and not exists (select 1 from public.organization_legacy_records where legacy_record_id = 'projection-reconcile-conflict') and not exists (select 1 from public.organizations where id in ('00000000-0000-0000-0000-00000000c111','00000000-0000-0000-0000-00000000c112'))")" != "t" ]; then
            echo "The expected conflict rollback left fixture rows behind."
            exit 1
          fi
      - name: Verify out-of-range projection values fail before reconciliation writes
        shell: bash
        run: |
          mapfile -t db_containers < <(docker ps --filter label=com.supabase.cli.project --filter name=supabase_db --format '{{.Names}}')
          if [ "${#db_containers[@]}" -ne 1 ]; then
            echo "Expected exactly one Supabase database container; refusing to run numeric guard fixture."
            exit 1
          fi
          set +e
          migration_output=$(
            {
              sed '/^-- LEGACY_PROJECTION_RECONCILE_INVALID_MIGRATION_BARRIER$/,$d' scripts/sql/legacy-projection-reconcile-invalid-ci.test.sql
              cat supabase/migrations/20261002170000_reconcile_source_scoped_legacy_projections.sql
            } | docker exec -i "${db_containers[0]}" psql -U postgres -d postgres -v ON_ERROR_STOP=1 2>&1
          )
          migration_status=$?
          set -e
          if [ "$migration_status" -eq 0 ] || ! grep -Fq "integer value is outside the supported range" <<< "$migration_output"; then
            echo "Expected reconciliation to reject an out-of-range NPS integer before casting or writing."
            exit 1
          fi
          if [ "$(docker exec "${db_containers[0]}" psql -U postgres -d postgres -Atqc "select not exists (select 1 from public.legacy_records where record_id = 'projection-reconcile-overflow') and not exists (select 1 from public.organization_legacy_records where legacy_record_id = 'projection-reconcile-overflow') and not exists (select 1 from public.organizations where id = '00000000-0000-0000-0000-00000000c121')")" != "t" ]; then
            echo "The expected numeric guard rollback left fixture rows behind."
            exit 1
          fi
      - name: Verify fresh tenant bootstrap does not scope legacy rows without an owner
        shell: bash
        run: |
          mapfile -t db_containers < <(docker ps --filter label=com.supabase.cli.project --filter name=supabase_db --format '{{.Names}}')
          if [ "${#db_containers[@]}" -ne 1 ]; then
            echo "Expected exactly one Supabase database container; refusing to run bootstrap fixture."
            exit 1
          fi
          docker exec -i "${db_containers[0]}" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < scripts/sql/bootstrap-owner-integrity-ci.test.sql
      - name: Verify legacy tenant bootstrap fails closed without an owner
        shell: bash
        run: |
          mapfile -t db_containers < <(docker ps --filter label=com.supabase.cli.project --filter name=supabase_db --format '{{.Names}}')
          if [ "${#db_containers[@]}" -ne 1 ]; then
            echo "Expected exactly one Supabase database container; refusing to run bootstrap guard fixture."
            exit 1
          fi
          set +e
          migration_output=$(
            {
              printf '%s\n' "BEGIN;" "INSERT INTO public.legacy_records (entity, record_id, payload) VALUES ('BootstrapOwnerGuardCI', 'synthetic-no-owner', '{}'::jsonb);"
              cat supabase/migrations/20260927023629_bootstrap_dominio_tenant.sql
            } | docker exec -i "${db_containers[0]}" psql -U postgres -d postgres -v ON_ERROR_STOP=1 2>&1
          )
          migration_status=$?
          set -e
          if [ "$migration_status" -eq 0 ] || ! grep -Fq "Tenant bootstrap requires an active Master/Admin collaborator" <<< "$migration_output"; then
            echo "Expected bootstrap to fail closed when legacy data has no active owner."
            exit 1
          fi
          if [ "$(docker exec "${db_containers[0]}" psql -U postgres -d postgres -Atqc "select not exists (select 1 from public.legacy_records where entity = 'BootstrapOwnerGuardCI' and record_id = 'synthetic-no-owner')")" != "t" ]; then
            echo "Bootstrap guard fixture was not rolled back after the expected failure."
            exit 1
          fi
      - name: Verify owner bootstrap scopes legacy data idempotently
        shell: bash
        run: |
          mapfile -t db_containers < <(docker ps --filter label=com.supabase.cli.project --filter name=supabase_db --format '{{.Names}}')
          if [ "${#db_containers[@]}" -ne 1 ]; then
            echo "Expected exactly one Supabase database container; refusing to run positive bootstrap fixture."
            exit 1
          fi
          {
            printf '%s\n' "BEGIN;"
            printf '%s\n' "INSERT INTO public.maestro_collaborators (id, login, password_hash, is_active, profile) VALUES ('bootstrap-owner-positive-ci', 'bootstrap-owner-positive-ci', '', true, '{\"access_level\":\"admin\"}'::jsonb);"
            printf '%s\n' "INSERT INTO public.legacy_records (entity, record_id, payload) VALUES ('BootstrapOwnerGuardCIPositive', 'synthetic-owned-record', '{}'::jsonb);"
            cat supabase/migrations/20260927023629_bootstrap_dominio_tenant.sql
            cat supabase/migrations/20260927023629_bootstrap_dominio_tenant.sql
            cat scripts/sql/bootstrap-owner-positive-ci.assert.sql
            printf '%s\n' "ROLLBACK;"
          } | docker exec -i "${db_containers[0]}" psql -U postgres -d postgres -v ON_ERROR_STOP=1
          if [ "$(docker exec "${db_containers[0]}" psql -U postgres -d postgres -Atqc "select not exists (select 1 from public.maestro_collaborators where id = 'bootstrap-owner-positive-ci') and not exists (select 1 from public.legacy_records where entity = 'BootstrapOwnerGuardCIPositive' and record_id = 'synthetic-owned-record')")" != "t" ]; then
            echo "Positive bootstrap fixture left synthetic rows behind after rollback."
            exit 1
          fi
      - name: Verify missing WhatsApp scheduler config preserves an existing job
        shell: bash
        run: |
          mapfile -t db_containers < <(docker ps --filter label=com.supabase.cli.project --filter name=supabase_db --format '{{.Names}}')
          if [ "${#db_containers[@]}" -ne 1 ]; then
            echo "Expected exactly one Supabase database container; refusing to run scheduler fixture."
            exit 1
          fi
          {
            sed '/^-- WHATSAPP_SCHEDULER_CONFIG_MISSING_BARRIER$/,$d' scripts/sql/whatsapp-scheduler-preservation-ci.test.sql
            cat supabase/migrations/20261001160000_preserve_whatsapp_scheduler_without_vault_config.sql
            sed -n '/^-- WHATSAPP_SCHEDULER_CONFIG_MISSING_BARRIER$/,$p' scripts/sql/whatsapp-scheduler-preservation-ci.test.sql | sed '1d' | sed '/^-- WHATSAPP_SCHEDULER_CONFIGURED_BARRIER$/,$d'
            cat supabase/migrations/20261001160000_preserve_whatsapp_scheduler_without_vault_config.sql
            sed -n '/^-- WHATSAPP_SCHEDULER_CONFIGURED_BARRIER$/,$p' scripts/sql/whatsapp-scheduler-preservation-ci.test.sql | sed '1d'
          } | docker exec -i "${db_containers[0]}" psql -U postgres -d postgres -v ON_ERROR_STOP=1
      - name: Lint the resulting public schema
        run: supabase db lint --local --schema public --level error
      - name: Verify RLS isolation, tenant-aware foreign keys, and core integrity audit
        shell: bash
        run: |
          mapfile -t db_containers < <(docker ps --filter label=com.supabase.cli.project --filter name=supabase_db --format '{{.Names}}')
          if [ "${#db_containers[@]}" -ne 1 ]; then
            echo "Expected exactly one Supabase database container; refusing to run tenant fixtures."
            exit 1
          fi
          docker exec -i "${db_containers[0]}" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < scripts/sql/tenant-isolation-ci.test.sql
          docker exec -i "${db_containers[0]}" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < scripts/sql/legacy-mutation-tenant-context-ci.test.sql
          docker exec -i "${db_containers[0]}" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < scripts/sql/verify_atomic_project_delete.sql
          docker exec -i "${db_containers[0]}" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < scripts/sql/verify_task_audit_tenant_scope.sql
          docker exec -i "${db_containers[0]}" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < scripts/sql/verify_atomic_project_financial_deletes.sql
          {
            sed '/^-- MIGRATION_BARRIER:/,$d' scripts/sql/reconcile-core-subtask-links-clone.test.sql
            cat supabase/migrations/20261001140000_reconcile_core_subtask_links.sql
            cat supabase/migrations/20261001140000_reconcile_core_subtask_links.sql
            cat supabase/migrations/20261001150000_relink_subtasks_on_job_recovery.sql
            sed -n '/^-- MIGRATION_BARRIER:/,$p' scripts/sql/reconcile-core-subtask-links-clone.test.sql | sed '1d'
          } | docker exec -i "${db_containers[0]}" psql -U postgres -d postgres -v ON_ERROR_STOP=1
          docker exec -i "${db_containers[0]}" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < scripts/sql/audit_core_tenant_integrity.sql
          docker exec -i "${db_containers[0]}" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < scripts/sql/test_core_tenant_policies_clone.sql
          docker exec -i "${db_containers[0]}" psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 < scripts/sql/test_dev_ensure_rls_event_trigger_clone.sql
          {
            sed '/^-- MIGRATION_BARRIER:/,$d' scripts/sql/reconciliation-queue-tenant-backfill-clone.test.sql
            cat supabase/migrations/20260930180000_fix_reconciliation_invoker_privileges.sql
            sed -n '/^-- MIGRATION_BARRIER:/,$p' scripts/sql/reconciliation-queue-tenant-backfill-clone.test.sql | sed '1d'
          } | docker exec -i "${db_containers[0]}" psql -U postgres -d postgres -v ON_ERROR_STOP=1
          npm run verify:rls-policy-catalog
          {
            cat scripts/sql/timesheet-projection-repair-fixtures.sql
            cat supabase/migrations/20260930140000_repair_timesheet_payload_projection.sql
            cat scripts/sql/timesheet-projection-repair-assertions.sql
            cat supabase/migrations/20260930140000_repair_timesheet_payload_projection.sql
            cat scripts/sql/timesheet-projection-repair-assertions.sql
            printf 'ROLLBACK;\n'
          } | docker exec -i "${db_containers[0]}" psql -U postgres -d postgres -v ON_ERROR_STOP=1
      - name: Verify tenant-safe Timesheet backfill and dual-write
        shell: bash
        run: |
          mapfile -t db_containers < <(docker ps --filter label=com.supabase.cli.project --filter name=supabase_db --format '{{.Names}}')
          if [ "${#db_containers[@]}" -ne 1 ]; then
            echo "Expected exactly one Supabase database container; refusing to run Timesheet fixtures."
            exit 1
          fi
          {
            sed '/^-- TIMESHEET_MIGRATION_BARRIER$/,$d' scripts/sql/timesheet-tenant-projection-ci.test.sql
            cat supabase/migrations/20261001120000_reconcile_timesheet_tenant_projection.sql
            cat supabase/migrations/20261001120000_reconcile_timesheet_tenant_projection.sql
            sed -n '/^-- TIMESHEET_MIGRATION_BARRIER$/,$p' scripts/sql/timesheet-tenant-projection-ci.test.sql | sed '1d'
          } | docker exec -i "${db_containers[0]}" psql -U postgres -d postgres -v ON_ERROR_STOP=1

  unit-tests:
    name: Authorization and regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node --test supabase/functions/_shared/*.test.mjs scripts/lib/*.test.mjs
      - name: Build the Maestro frontend
        run: npm run build
      - name: Verify Jobs and Ads Brain module boundaries
        run: npm run verify:frontend-module-boundaries
      - run: npm run verify:edge-function-product-boundaries
      - name: Verify relational dispatch when Maestro app sources are present
        run: |
          if [ -f scripts/verify-relational-dispatch.mjs ]; then
            npm run verify:relational-dispatch
          else
            echo "::notice::Maestro runtime source is outside this migration-only candidate; SQL replay/lint runs in the dedicated database job."
          fi
      - name: Verify migration inventory when the source auditor is present
        run: |
          if [ -f scripts/verify-migration-files.mjs ]; then
            npm run verify:migration-files
          else
            echo "::notice::Static migration auditor is not part of this candidate; clean-room replay/lint validates every SQL file."
          fi
      - name: Verify RLS target product ownership
        run: npm run verify:policy-target-ownership
      - name: Verify functional inventory when app sources are present
        run: |
          if [ -f scripts/verify-functional-inventory.mjs ]; then
            npm run verify:functional-inventory
          else
            echo "::notice::Frontend/application inventory is not part of this database-only candidate."
          fi

  semgrep:
    name: Static security analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check semgrep==1.178.0
      - run: semgrep scan --config p/security-audit --error --metrics=off

  trivy:
    name: Active application dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          skip-dirs: node_modules,.git,base44-source
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: "1"

  trivy-config:
    name: Container configuration report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig
          skip-dirs: node_modules,.git,base44-source
          severity: HIGH,CRITICAL
          exit-code: "0"

  trufflehog:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - name: Scan changed commits
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@20652fbbdefffcdaa493a5bf57ab2ac6b1db715b # v3.97.1
        with:
          version: 3.97.1
          extra_args: --results=verified,unknown
      - name: Scan complete branch history
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: trufflesecurity/trufflehog@20652fbbdefffcdaa493a5bf57ab2ac6b1db715b # v3.97.1
        with:
          version: v3.97.1
          base: ""
          head: ${{ github.ref_name }}
          extra_args: --results=verified,unknown
