name: Security checks

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database-migration-replay:
    name: Clean-room database migration replay
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_TEST_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      SUPABASE_TEST_PROJECT_REF: maestro-local-verify
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install verifier dependencies
        run: npm ci --ignore-scripts
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.115.0
      - name: Start only the local database
        run: supabase start --exclude gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Replay every migration from a clean database
        run: supabase db reset --local --no-seed
      - name: Lint the resulting public schema
        run: supabase db lint --local --schema public --level error
      - name: Verify RLS isolation, tenant-aware foreign keys, and core integrity audit
        shell: bash
        run: |
          mapfile -t db_containers < <(docker ps --filter label=com.supabase.cli.project --filter name=supabase_db --format '{{.Names}}')
          if [ "${#db_containers[@]}" -ne 1 ]; then
            echo "Expected exactly one Supabase database container; refusing to run tenant fixtures."
            exit 1
          fi
          docker exec -i "${db_containers[0]}" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < scripts/sql/tenant-isolation-ci.test.sql
          docker exec -i "${db_containers[0]}" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < scripts/sql/audit_core_tenant_integrity.sql
          docker exec -i "${db_containers[0]}" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < scripts/sql/test_core_tenant_policies_clone.sql
          docker exec -i "${db_containers[0]}" psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 < scripts/sql/test_dev_ensure_rls_event_trigger_clone.sql
          {
            sed '/^-- MIGRATION_BARRIER:/,$d' scripts/sql/reconciliation-queue-tenant-backfill-clone.test.sql
            cat supabase/migrations/20260930180000_fix_reconciliation_invoker_privileges.sql
            sed -n '/^-- MIGRATION_BARRIER:/,$p' scripts/sql/reconciliation-queue-tenant-backfill-clone.test.sql | sed '1d'
          } | docker exec -i "${db_containers[0]}" psql -U postgres -d postgres -v ON_ERROR_STOP=1
          npm run verify:rls-policy-catalog
          {
            cat scripts/sql/timesheet-projection-repair-fixtures.sql
            cat supabase/migrations/20260930140000_repair_timesheet_payload_projection.sql
            cat scripts/sql/timesheet-projection-repair-assertions.sql
            cat supabase/migrations/20260930140000_repair_timesheet_payload_projection.sql
            cat scripts/sql/timesheet-projection-repair-assertions.sql
            printf 'ROLLBACK;\n'
          } | docker exec -i "${db_containers[0]}" psql -U postgres -d postgres -v ON_ERROR_STOP=1
      - name: Verify tenant-safe Timesheet backfill and dual-write
        shell: bash
        run: |
          mapfile -t db_containers < <(docker ps --filter label=com.supabase.cli.project --filter name=supabase_db --format '{{.Names}}')
          if [ "${#db_containers[@]}" -ne 1 ]; then
            echo "Expected exactly one Supabase database container; refusing to run Timesheet fixtures."
            exit 1
          fi
          {
            sed '/^-- TIMESHEET_MIGRATION_BARRIER$/,$d' scripts/sql/timesheet-tenant-projection-ci.test.sql
            cat supabase/migrations/20261001120000_reconcile_timesheet_tenant_projection.sql
            cat supabase/migrations/20261001120000_reconcile_timesheet_tenant_projection.sql
            sed -n '/^-- TIMESHEET_MIGRATION_BARRIER$/,$p' scripts/sql/timesheet-tenant-projection-ci.test.sql | sed '1d'
          } | docker exec -i "${db_containers[0]}" psql -U postgres -d postgres -v ON_ERROR_STOP=1

  unit-tests:
    name: Authorization and regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node --test supabase/functions/_shared/*.test.mjs scripts/lib/*.test.mjs
      - name: Build the Maestro frontend
        run: npm run build
      - name: Verify Jobs and Ads Brain module boundaries
        run: npm run verify:frontend-module-boundaries
      - run: npm run verify:edge-function-product-boundaries
      - name: Verify relational dispatch when Maestro app sources are present
        run: |
          if [ -f scripts/verify-relational-dispatch.mjs ]; then
            npm run verify:relational-dispatch
          else
            echo "::notice::Maestro runtime source is outside this migration-only candidate; SQL replay/lint runs in the dedicated database job."
          fi
      - name: Verify migration inventory when the source auditor is present
        run: |
          if [ -f scripts/verify-migration-files.mjs ]; then
            npm run verify:migration-files
          else
            echo "::notice::Static migration auditor is not part of this candidate; clean-room replay/lint validates every SQL file."
          fi
      - name: Verify RLS target product ownership
        run: npm run verify:policy-target-ownership
      - name: Verify functional inventory when app sources are present
        run: |
          if [ -f scripts/verify-functional-inventory.mjs ]; then
            npm run verify:functional-inventory
          else
            echo "::notice::Frontend/application inventory is not part of this database-only candidate."
          fi

  semgrep:
    name: Static security analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check semgrep==1.178.0
      - run: semgrep scan --config p/security-audit --error --metrics=off

  trivy:
    name: Active application dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          skip-dirs: node_modules,.git,base44-source
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: "1"

  trivy-config:
    name: Container configuration report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig
          skip-dirs: node_modules,.git,base44-source
          severity: HIGH,CRITICAL
          exit-code: "0"

  trufflehog:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - name: Scan changed commits
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@20652fbbdefffcdaa493a5bf57ab2ac6b1db715b # v3.97.1
        with:
          version: 3.97.1
          extra_args: --results=verified,unknown
      - name: Scan complete branch history
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: trufflesecurity/trufflehog@20652fbbdefffcdaa493a5bf57ab2ac6b1db715b # v3.97.1
        with:
          version: v3.97.1
          base: ""
          head: ${{ github.ref_name }}
          extra_args: --results=verified,unknown
