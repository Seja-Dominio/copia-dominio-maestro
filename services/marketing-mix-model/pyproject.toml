[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "maestro-marketing-mix-model"
version = "0.1.0"
description = "Secure aggregate-only MMM service for Maestro"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
meridian = ["google-meridian==1.7.0"]
test = ["pytest>=8,<9"]

[tool.setuptools]
py-modules = ["app", "meridian_runner"]
